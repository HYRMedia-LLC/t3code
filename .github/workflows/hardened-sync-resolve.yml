name: Hardened Sync Resolve

on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: main
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SYNC_APP_ID:
        required: true
      SYNC_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to merge upstream into"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  # The agent reads upstream's text and runs its code, so this job holds no write credential.
  resolve:
    name: Resolve conflicts
    if: github.repository == 'HYRMedia-LLC/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
    steps:
      # No credential on disk. actions/checkout cannot do this here: removing its credential runs
      # git submodule foreach, which fails on the .repos gitlinks. The repository is public.
      - name: Checkout
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --quiet --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --quiet -B "$BRANCH" "origin/$BRANCH"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # Claude Code needs bubblewrap and socat to keep the API key out of the agent's commands.
      # Ubuntu 24.04 blocks the user namespaces that bubblewrap needs.
      - name: Install Claude Code
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@2.1.316
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >>"$GITHUB_PATH"
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - id: resolve
        name: Merge upstream and resolve conflicts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .github/hardened/resolve-sync.sh "$RUNNER_TEMP/sync"

      - name: Upload the merge
        if: steps.resolve.outputs.resolved == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          include-hidden-files: true

  # A new runner holds the App token and treats the merge as data.
  land:
    name: Land after CI
    needs: resolve
    if: needs.resolve.outputs.resolved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # No credential on disk. actions/checkout cannot do this here: removing its credential runs
      # git submodule foreach, which fails on the .repos gitlinks. The repository is public.
      - name: Checkout
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --quiet --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --quiet -B "$BRANCH" "origin/$BRANCH"

      - name: Download the merge
        uses: actions/download-artifact@v8
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync

      - id: sync_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Check, run CI, and land
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.sync_token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
        run: .github/hardened/land-sync.sh "$RUNNER_TEMP/sync" "$BRANCH"
